name: dormflow

services:
  dormflow-postgres:
    image: postgres:17-alpine
    container_name: dormflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dormflow}
      POSTGRES_USER: ${POSTGRES_USER:-dormflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ຕ້ອງໄດ້ຮັບການກໍານົດ POSTGRES_PASSWORD ໃນໄຟລ໌ .env}
      # ເລັ່ງການຈັບຄູ່ຂໍ້ຄວາມ ແລະຕັ້ງທ້ອງຖິ່ນທີ່ສອດຄ່ອງກັນໃນທຸກອຸປະກອນ
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # The database stays private on the Compose network. The API reaches it at
    # dormflow-postgres:5432; friends should use the API, never PostgreSQL.
    volumes:
      - dormflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # ລະບຸ -d ແລະ -U ເຮັດສໍາເລັດມັນຫຼືອື່ນໆ pg_isready ມັນຈະຖືກລາຍງານວ່າຖານຂໍ້ມູນຍັງບໍ່ທັນໄດ້ຖືກສ້າງຂຶ້ນ
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dormflow} -d ${POSTGRES_DB:-dormflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dormflow-network

  dormflow-api:
    image: dormflow-api:latest
    container_name: dormflow-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/DormFlow.Api/Dockerfile
    depends_on:
      dormflow-postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      # TLS ຄຸ້ມຄອງໂດຍ reverse proxy ທີ່ຢູ່ຕໍ່ໜ້າຕູ້ຄອນເທນເນີ
      Https__EnableRedirection: "false"
      ForwardedHeaders__KnownProxies__0: ${ForwardedHeaders__KnownProxies__0:-}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?ຕ້ອງໄດ້ຮັບການກໍານົດ Connection String ໃນໄຟລ໌ .env}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:-http://localhost:3000}
      Cors__AllowedOrigins__1: ${Cors__AllowedOrigins__1:-}
      RateLimiting__Enabled: ${RateLimiting__Enabled:-true}
      RateLimiting__PermitLimit: ${RateLimiting__PermitLimit:-100}
      RateLimiting__WindowSeconds: ${RateLimiting__WindowSeconds:-60}
      # ທີ່ສໍາຄັນສໍາລັບການລົງນາມ JWT ສະເຝີຕ້ອງປັບແຕ່ງບໍ່ມີຄ່າເລີ່ມຕົ້ນເພາະວ່າ appsettings.json ເຈດຕະນາປະໄວ້ຫວ່າງເປົ່າ
      Jwt__SigningKey: ${Jwt__SigningKey:?ຕ້ອງໄດ້ຮັບການກໍານົດ Jwt__SigningKey ໃນໄຟລ໌ .env}
      Jwt__Issuer: ${Jwt__Issuer:-DormFlow}
      Jwt__Audience: ${Jwt__Audience:-DormFlow.Client}
      # ໃຊ້ pickup directory ເປັນຄ່າເລີ່ມຕົ້ນໃນ local development; ຕັ້ງ Email__Provider=Smtp ເມື່ອມີ SMTP ຈິງ
      Email__Provider: ${Email__Provider:-PickupDirectory}
      Email__FromAddress: ${Email__FromAddress:-no-reply@dormflow.local}
      Email__FromName: ${Email__FromName:-DormFlow}
      Email__PickupDirectory: ${Email__PickupDirectory:-logs/emails}
      Email__SmtpHost: ${Email__SmtpHost:-}
      Email__SmtpPort: ${Email__SmtpPort:-587}
      Email__SmtpUseSsl: ${Email__SmtpUseSsl:-true}
      Email__SmtpUsername: ${Email__SmtpUsername:-}
      Email__SmtpPassword: ${Email__SmtpPassword:-}
      # ປັບລະບົບຖານຂໍ້ມູນໂດຍອັດຕະໂນມັດໃນເວລາເລີ່ມຕົ້ນ. ປະໄວ້ເພື່ອຄວາມສະດວກໃນເວລາແລ່ນຄັ້ງທໍາອິດ
      # ປິດຄ່ານີ້ (false) ແລ້ວແລ່ນ dotnet ef database update ແຍກກ່ອນ deploy ເມື່ອແລ່ນຫຼາຍຕົວຢ່າງພ້ອມໆກັນ
      Database__AutoMigrate: ${Database__AutoMigrate:-false}
      Database__EnableSensitiveDataLogging: ${Database__EnableSensitiveDataLogging:-false}
      # ຂໍ້ມູນຜູ້ເບິ່ງແຍງລະບົບເລີ່ມຕົ້ນ: ທາງເລືອກ. ຖ້າບໍ່ໄດ້ລະບຸ, ການສ້າງບັນຊີນີ້ຈະຖືກຂ້າມໄປ
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_FIRST_NAME: ${SEED_ADMIN_FIRST_NAME:-}
      SEED_ADMIN_LAST_NAME: ${SEED_ADMIN_LAST_NAME:-}
    ports:
      - "127.0.0.1:${API_HTTP_PORT:-8081}:8080"
    volumes:
      - dormflow-api-logs:/app/logs
    healthcheck:
      # ໂທ endpoint live ພຽງແຕ່ເພື່ອໃຫ້ກ່ອງບັນຈຸບໍ່ໄດ້ຖືກເລີ່ມຕົ້ນໃຝ່ພຽງແຕ່ຍ້ອນວ່າຖານຂໍ້ມູນຖືກປິດຊົ່ວຄາວ
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - dormflow-network

volumes:
  dormflow-postgres-data:
    name: dormflow-postgres-data
  dormflow-api-logs:
    name: dormflow-api-logs

networks:
  dormflow-network:
    name: dormflow-network
    driver: bridge
